# Optional Blueprint. If your Render Web Service already exists, edit its settings
# instead of importing this file and creating a second service.
# Free Web Service filesystem is ephemeral; accounts and files live in the separately backed-up PostgreSQL database.
services:
  - type: web
    name: american-corner
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: AC_DEMO
        value: "0"
      - key: AC_DATA
        value: /tmp/american-corner-data
      - key: AC_BASE_URL
        value: https://amer-corner.oymiketech.com
      - key: AC_ADMIN_EMAIL
        sync: false
      - key: AC_ADMIN_PASSWORD
        sync: false
# DATABASE_URL is already configured privately on the existing Render service.
# Never paste its value in this file. The former sole user will re-register; verify new accounts after restart.
