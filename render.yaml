# Optional Blueprint. If your Render Web Service already exists, edit its settings
# instead of importing this file and creating a second service.
# The Free plan is an ephemeral demonstration only: do not store real academic data.
services:
  - type: web
    name: american-corner
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: AC_DEMO
        value: "0"
      - key: AC_DATA
        value: /tmp/american-corner-data
      - key: AC_BASE_URL
        value: https://amer-corner.oymiketech.com
      - key: AC_ADMIN_EMAIL
        sync: false
      - key: AC_ADMIN_PASSWORD
        sync: false
